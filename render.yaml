services:
  - type: web
    name: autopilot-ai-trading
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: STRICT_PAPER_TRADING_ONLY
        value: true
      - key: INITIAL_VIRTUAL_CAPITAL_INR
        value: 5000.00
