name: Render Keep-Alive Heartbeat

on:
  schedule:
    # Run every 10 minutes continuously to prevent Render free-tier cold sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Cloud Server
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -m 45 "https://autopilot-ai-trading.onrender.com/api/health")
          echo "Render Heartbeat Response:"
          echo "$RESPONSE"
